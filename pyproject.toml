[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nsfw-analyzer-pro"
version = "2.3.0"
description = "Настольное приложение для локального анализа изображений на NSFW-контент"
authors = [{ name = "Vanitoo" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tensorflow>=2.16,<3.0",
    "keras>=3.0,<4.0",
    "opennsfw2[keras3]>=0.19.0,<1.0",
    "Pillow>=10.0,<13.0",
    "numpy>=1.26,<3.0",
    "tensorflow-hub>=0.16.1,<1.0",
]

[project.optional-dependencies]
models = [
    "torch>=2.6,<3.0",
    "torchvision>=0.21,<1.0",
    "transformers>=4.44,<6.0",
    "timm>=1.0,<2.0",
    "nudenet>=3.4.2,<4.0",
]

[project.scripts]
nsfw-analyzer = "main:main"

[tool.setuptools]
py-modules = ["main", "ui", "scanner", "analyzer", "models_extra", "utils"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "EM", "SIM", "PTH", "RUF", "UP"]
ignore = ["B904", "EM101", "RUF001", "RUF002", "RUF003"]
fixable = ["ALL"]
unfixable = ["F401", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["analyzer", "scanner", "ui", "utils"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
